name: abc20261102-gpu
services:
  llm7b:
    image: ollama/ollama:latest
    restart: unless-stopped
    gpus: all
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    ports:
      - "127.0.0.1:28434:11434"
    volumes:
      - abc20261102-ollama:/root/.ollama
volumes:
  abc20261102-ollama:
