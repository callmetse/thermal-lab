[unix_http_server]
file=/root/abc20261102/state/supervisor.sock
chmod=0600
[supervisord]
logfile=/root/abc20261102/results/supervisor.log
pidfile=/root/abc20261102/state/supervisor.pid
childlogdir=/root/abc20261102/results
[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface
[supervisorctl]
serverurl=unix:///root/abc20261102/state/supervisor.sock
[program:mqtt-tunnel]
priority=10
command=/usr/bin/ssh -N -T -F /dev/null -i /root/.ssh/abc20261102_mqtt -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/root/.ssh/known_hosts_abc20261102 -o ExitOnForwardFailure=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -L 127.0.0.1:28883:127.0.0.1:28883 root@192.0.2.10
autorestart=true
startretries=30
startsecs=2
stdout_logfile=/root/abc20261102/results/mqtt-tunnel.log
redirect_stderr=true
[program:vision-cloud]
priority=20
command=/root/abc20261102/.venv/bin/python -m lab.worker cloud
directory=/root/abc20261102
autorestart=true
startretries=30
startsecs=2
stdout_logfile=/root/abc20261102/results/worker-cloud.log
redirect_stderr=true
[program:media-broker]
autostart=true
priority=5
command=/root/abc20261102/runtime/mosquitto/sbin/mosquitto -c /root/abc20261102/deploy/media-mosquitto.conf
environment=LD_LIBRARY_PATH="/root/abc20261102/runtime/mosquitto/usr/lib/x86_64-linux-gnu"
directory=/root/abc20261102
autorestart=true
startretries=30
startsecs=2
stdout_logfile=/root/abc20261102/results/media-broker.log
redirect_stderr=true
[program:llm-adapter]
priority=30
command=/root/abc20261102/.venv/bin/python -m lab.llm
directory=/root/abc20261102
autorestart=true
startretries=30
startsecs=2
stdout_logfile=/root/abc20261102/results/llm-adapter.log
redirect_stderr=true
[program:ollama]
priority=10
command=/root/abc20261102/runtime/ollama/bin/ollama serve
directory=/root/abc20261102
environment=OLLAMA_HOST="127.0.0.1:28434",OLLAMA_MODELS="/root/abc20261102/state/ollama-models",OLLAMA_NUM_PARALLEL="1",OLLAMA_MAX_LOADED_MODELS="1"
autorestart=true
startretries=30
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/root/abc20261102/results/ollama-supervised.log
redirect_stderr=true
