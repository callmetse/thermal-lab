[unix_http_server]
file=/home/pi/abc20261102/state/supervisor.sock
chmod=0600
[supervisord]
logfile=/home/pi/abc20261102/results/supervisor.log
pidfile=/home/pi/abc20261102/state/supervisor.pid
childlogdir=/home/pi/abc20261102/results
[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface
[supervisorctl]
serverurl=unix:///home/pi/abc20261102/state/supervisor.sock
[program:mqtt-tunnel]
priority=10
command=/usr/bin/ssh -N -T -F /dev/null -i /home/pi/.ssh/abc20261102_mqtt -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/home/pi/.ssh/known_hosts_abc20261102 -o ExitOnForwardFailure=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -L 127.0.0.1:28883:127.0.0.1:28883 root@192.0.2.10
autorestart=true
startretries=30
startsecs=2
stdout_logfile=/home/pi/abc20261102/results/mqtt-tunnel.log
redirect_stderr=true
[program:vision-edge]
priority=20
command=/home/pi/abc20261102/.venv/bin/python -m lab.worker edge
directory=/home/pi/abc20261102
autorestart=true
startretries=30
startsecs=2
stdout_logfile=/home/pi/abc20261102/results/worker-edge.log
redirect_stderr=true
environment=OMP_NUM_THREADS="4",OPENBLAS_NUM_THREADS="4",MKL_NUM_THREADS="4",NCNN_NUM_THREADS="4"

[program:dataset-api]
priority=20
command=/home/pi/abc20261102/.venv/bin/python -m lab.dataset_api
directory=/home/pi/abc20261102
autorestart=true
startretries=30
startsecs=2
stdout_logfile=/home/pi/abc20261102/results/dataset-api.log
redirect_stderr=true
[program:media-tunnel]
autostart=true
command=/usr/bin/ssh -N -T -F /dev/null -p 12434 -i /home/pi/.ssh/abc20261102_media -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/home/pi/.ssh/known_hosts_abc20261102_media -o ExitOnForwardFailure=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -L 127.0.0.1:28583:127.0.0.1:28583 root@gpu.example.invalid
priority=10
autorestart=true
startretries=30
startsecs=2
stdout_logfile=/home/pi/abc20261102/results/media-tunnel.log
redirect_stderr=true
[program:console-tunnel]
command=/usr/bin/ssh -N -T -F /dev/null -i /home/pi/.ssh/abc20261102_console -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/home/pi/.ssh/known_hosts_abc20261102 -o ExitOnForwardFailure=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -L 127.0.0.1:28881:127.0.0.1:28880 root@192.0.2.10
priority=10
autorestart=true
startretries=30
startsecs=2
stdout_logfile=/home/pi/abc20261102/results/console-tunnel.log
redirect_stderr=true
[program:console-gateway]
command=/bin/sh /home/pi/abc20261102/deploy/run_console_gateway.sh
directory=/home/pi/abc20261102
environment=XDG_DATA_HOME="/home/pi/abc20261102/state/caddy-data",XDG_CONFIG_HOME="/home/pi/abc20261102/state/caddy-config"
priority=20
autorestart=true
startretries=30
startsecs=2
