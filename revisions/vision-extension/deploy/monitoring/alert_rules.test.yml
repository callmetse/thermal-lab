rule_files:
  - alert_rules.yml
evaluation_interval: 30s
tests:
  - interval: 30s
    input_series:
      - series: 'up{job="abc-pi",instance="pi"}'
        values: '1 0+0x5'
      - series: 'up{job="abc-pi",instance="no-textfile"}'
        values: '1+0x6'
      - series: 'abc_ops_last_sample_timestamp_seconds{job="abc-pi",instance="pi"}'
        values: '0+0x6'
      - series: 'abc_ops_sensor_fresh{job="abc-pi",instance="pi",field="co2_ppm"}'
        values: '1 0+0x5'
      - series: 'abc_ops_sensor_fresh{job="abc-pi",instance="pi",field="temperature_c"}'
        values: '1+0x6'
      - series: 'abc_ops_pi_current_undervoltage{job="abc-pi",instance="pi"}'
        values: '0 1 0+0x4'
    alert_rule_test:
      - eval_time: 60s
        alertname: ExperimentPiScrapeMissing
        exp_alerts: []
      - eval_time: 180s
        alertname: ExperimentPiScrapeMissing
        exp_alerts:
          - exp_labels: {job: abc-pi, instance: pi}
      - eval_time: 180s
        alertname: ExperimentPiSampleStale
        exp_alerts:
          - exp_labels: {job: abc-pi, instance: pi}
          - exp_labels: {job: abc-pi, instance: no-textfile}
      - eval_time: 180s
        alertname: ExperimentSensorStale
        exp_alerts:
          - exp_labels: {job: abc-pi, instance: pi, field: co2_ppm}
      - eval_time: 30s
        alertname: ExperimentPiUndervoltage
        exp_alerts:
          - exp_labels: {job: abc-pi, instance: pi}
      - eval_time: 60s
        alertname: ExperimentPiUndervoltage
        exp_alerts: []
  - interval: 30s
    input_series:
      - series: 'abc_ops_archive_backlog{job="abc-pi",instance="stalled"}'
        values: '3+0x8 0'
      - series: 'abc_ops_archive_oldest_age_s{job="abc-pi",instance="stalled"}'
        values: '45+30x8 0'
      - series: 'abc_ops_archive_delivered{job="abc-pi",instance="stalled"}'
        values: '20+0x8 23'
      - series: 'abc_ops_archive_backlog{job="abc-pi",instance="advancing"}'
        values: '3+0x9'
      - series: 'abc_ops_archive_oldest_age_s{job="abc-pi",instance="advancing"}'
        values: '45+30x9'
      - series: 'abc_ops_archive_delivered{job="abc-pi",instance="advancing"}'
        values: '20+1x9'
    alert_rule_test:
      - eval_time: 180s
        alertname: ExperimentArchiveBacklogStalled
        exp_alerts:
          - exp_labels: {job: abc-pi, instance: stalled}
      - eval_time: 270s
        alertname: ExperimentArchiveBacklogStalled
        exp_alerts: []
  - alert_rule_test:
      - eval_time: 120s
        alertname: ExperimentPiScrapeMissing
        exp_alerts:
          - exp_labels: {job: abc-pi}
