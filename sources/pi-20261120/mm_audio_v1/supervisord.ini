[unix_http_server]
file=/home/pi/mm_audio_v1/supervisor.sock
chmod=0600
[supervisord]
logfile=/home/pi/mm_audio_v1/results/supervisor.log
pidfile=/home/pi/mm_audio_v1/supervisor.pid
[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface
[supervisorctl]
serverurl=unix:///home/pi/mm_audio_v1/supervisor.sock
[program:audio-edge]
command=/home/pi/mm_audio_v1/.venv/bin/python -u /home/pi/mm_audio_v1/edge.py
directory=/home/pi/mm_audio_v1
autostart=true
autorestart=true
startsecs=3
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/home/pi/mm_audio_v1/results/audio-edge.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true
[program:audio-gateway]
command=/bin/sh /home/pi/mm_audio_v1/gateway.sh
directory=/home/pi/mm_audio_v1
environment=XDG_DATA_HOME="/home/pi/mm_audio_v1/state/caddy-data",XDG_CONFIG_HOME="/home/pi/mm_audio_v1/state/caddy-config"
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/home/pi/mm_audio_v1/results/gateway.log
redirect_stderr=true

[program:audio-profile]
command=/bin/sh /home/pi/mm_audio_v1/setup_capture.sh
directory=/home/pi/mm_audio_v1
autostart=true
autorestart=false
startsecs=0
priority=1
stdout_logfile=/home/pi/mm_audio_v1/results/audio-profile.log
redirect_stderr=true
