[unix_http_server]
file=/home/pi/env_sensor_v1/supervisor.sock
chmod=0600
[supervisord]
logfile=/home/pi/env_sensor_v1/supervisor.log
pidfile=/home/pi/env_sensor_v1/supervisor.pid
[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface
[supervisorctl]
serverurl=unix:///home/pi/env_sensor_v1/supervisor.sock
[program:env-gateway]
command=/home/pi/abc20261102/.venv/bin/python -u /home/pi/env_sensor_v1/env_gateway.py --host 0.0.0.0 --port 28984 --db /home/pi/env_sensor_v1/env_sensor.sqlite3 --retention-days 30
directory=/home/pi/env_sensor_v1
autostart=true
autorestart=true
startsecs=2
startretries=10
stopasgroup=true
killasgroup=true
stdout_logfile=/home/pi/env_sensor_v1/gateway.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
